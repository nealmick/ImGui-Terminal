name: macos-arm-test-suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos-arm:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # cmake     — driver; runner ships an older one but we want the
      #             same minimum used elsewhere in CI.
      # pkg-config — needed by CMake's find_package(PkgConfig) on POSIX.
      # bash 5     — test_setup.h's find_bash() prefers /opt/homebrew/bin/bash;
      #             baselines were generated against bash 5, not the
      #             macOS-shipped 3.2 at /bin/bash.
      # glfw, fontconfig, freetype — runtime libs imgui_win.cpp uses for
      #             windowing and font discovery / rasterization.
      - name: Install dependencies
        run: brew install cmake pkg-config bash glfw fontconfig freetype

      - name: Configure
        run: cmake -B build -S .

      - name: Build all targets
        run: cmake --build build --parallel

      - name: Prepare results dir
        if: success() || failure()
        run: mkdir -p results

      # Each test below is its own step so the Actions UI shows pass/fail
      # per test. `if: success() || failure()` lets every test run
      # regardless of whether earlier tests passed — useful when several
      # are broken and you want to see all of them in one CI run.

      # --- core suite ---
      - name: core / attrs_basic
        if: success() || failure()
        run: |
          ./build/test_core --input tests/automation/core/attrs_basic/input.sh --output results/core_attrs_basic.json
          diff -u tests/automation/core/attrs_basic/expected.json results/core_attrs_basic.json
      - name: core / colors_ansi_16
        if: success() || failure()
        run: |
          ./build/test_core --input tests/automation/core/colors_ansi_16/input.sh --output results/core_colors_ansi_16.json
          diff -u tests/automation/core/colors_ansi_16/expected.json results/core_colors_ansi_16.json
      - name: core / colors_osc4
        if: success() || failure()
        run: |
          ./build/test_core --input tests/automation/core/colors_osc4/input.sh --output results/core_colors_osc4.json
          diff -u tests/automation/core/colors_osc4/expected.json results/core_colors_osc4.json
      - name: core / colors_truecolor
        if: success() || failure()
        run: |
          ./build/test_core --input tests/automation/core/colors_truecolor/input.sh --output results/core_colors_truecolor.json
          diff -u tests/automation/core/colors_truecolor/expected.json results/core_colors_truecolor.json
      - name: core / cursor_bar
        if: success() || failure()
        run: |
          ./build/test_core --input tests/automation/core/cursor_bar/input.sh --output results/core_cursor_bar.json
          diff -u tests/automation/core/cursor_bar/expected.json results/core_cursor_bar.json
      - name: core / cursor_block
        if: success() || failure()
        run: |
          ./build/test_core --input tests/automation/core/cursor_block/input.sh --output results/core_cursor_block.json
          diff -u tests/automation/core/cursor_block/expected.json results/core_cursor_block.json
      - name: core / cursor_underline
        if: success() || failure()
        run: |
          ./build/test_core --input tests/automation/core/cursor_underline/input.sh --output results/core_cursor_underline.json
          diff -u tests/automation/core/cursor_underline/expected.json results/core_cursor_underline.json
      - name: core / hello
        if: success() || failure()
        run: |
          ./build/test_core --input tests/automation/core/hello/input.sh --output results/core_hello.json
          diff -u tests/automation/core/hello/expected.json results/core_hello.json
      - name: core / wide_cjk
        if: success() || failure()
        run: |
          ./build/test_core --input tests/automation/core/wide_cjk/input.sh --output results/core_wide_cjk.json
          diff -u tests/automation/core/wide_cjk/expected.json results/core_wide_cjk.json

      # --- input suite ---
      - name: input / arrow_line_edit
        if: success() || failure()
        run: |
          ./build/test_input --events tests/automation/input/arrow_line_edit/events.txt --output results/input_arrow_line_edit.json
          diff -u tests/automation/input/arrow_line_edit/expected.json results/input_arrow_line_edit.json
      - name: input / backspace_edit
        if: success() || failure()
        run: |
          ./build/test_input --events tests/automation/input/backspace_edit/events.txt --output results/input_backspace_edit.json
          diff -u tests/automation/input/backspace_edit/expected.json results/input_backspace_edit.json
      - name: input / clipboard_paste
        if: success() || failure()
        run: |
          ./build/test_input --events tests/automation/input/clipboard_paste/events.txt --output results/input_clipboard_paste.json
          diff -u tests/automation/input/clipboard_paste/expected.json results/input_clipboard_paste.json
      - name: input / ctrl_c_interrupt
        if: success() || failure()
        run: |
          ./build/test_input --events tests/automation/input/ctrl_c_interrupt/events.txt --output results/input_ctrl_c_interrupt.json
          diff -u tests/automation/input/ctrl_c_interrupt/expected.json results/input_ctrl_c_interrupt.json
      - name: input / type_hello
        if: success() || failure()
        run: |
          ./build/test_input --events tests/automation/input/type_hello/events.txt --output results/input_type_hello.json
          diff -u tests/automation/input/type_hello/expected.json results/input_type_hello.json
      - name: input / utf8_typing
        if: success() || failure()
        run: |
          ./build/test_input --events tests/automation/input/utf8_typing/events.txt --output results/input_utf8_typing.json
          diff -u tests/automation/input/utf8_typing/expected.json results/input_utf8_typing.json

      - name: Upload actual snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-snapshots
          path: results/

      - name: Package app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APP="build/p_osx.app"
          DMG="ImguiTerminal.dmg"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          cp -R "$APP" "dist/ImguiTerminal.app"
          hdiutil create -volname ImguiTerminal -srcfolder dist -ov -format UDZO "$DMG"

      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "latest"
          tag_name: "latest"
          files: ImguiTerminal.dmg
